<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Outlast</title>
  <meta name="description" content="Clear, checked survival skills: step-by-step guides, gear checklists, scenarios and a community forum.">
  <meta name="theme-color" content="#3f5228" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#2e3b1c" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iNyIgZmlsbD0iIzJjNmEzNyIvPjxjaXJjbGUgY3g9IjE2IiBjeT0iMTYiIHI9IjExLjUiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2ZmZiIgc3Ryb2tlLXdpZHRoPSIxLjgiLz48cGF0aCBkPSJNMTYgMy41djIuNU0xNiAyNnYyLjVNMy41IDE2SDZNMjYgMTZoMi41IiBzdHJva2U9IiNmZmYiIHN0cm9rZS13aWR0aD0iMS44IiBzdHJva2UtbGluZWNhcD0icm91bmQiLz48cGF0aCBkPSJNMTYgOC41IDEyIDE0LjVoMi4yTDExLjIgMTloOS42bC0zLTQuNUgyMFoiIGZpbGw9IiNmZmYiLz48cGF0aCBkPSJNMTYgMTl2MyIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjEuOCIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIi8+PC9zdmc+Cg==" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="outlast.css">
  <script>try { var t = JSON.parse(localStorage.getItem("outlast.theme")); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
  <a class="skip" href="#app" data-t="skip">Skip to content</a>

  <header class="header band">
    <div class="header__bar">
      <button class="icon-btn" id="burger" type="button" aria-controls="drawer" aria-expanded="false" data-t-aria="menu" aria-label="Menu">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <a class="logo" href="#/" aria-label="Outlast">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="#fff" stroke-width="2"/><path d="M16 2v3M16 27v3M2 16h3M27 16h3" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M16 7.5 11 15h2.6L10 20.5h12L18.4 15H21Z" fill="#fff"/><path d="M16 20.5V24" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        <span>OUTLAST</span>
      </a>
      <div class="hsearch" role="search">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <label class="sr-only" for="q" data-t="searchLabel">Search</label>
        <input id="q" type="search" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="sres" aria-autocomplete="list" data-t-ph="search" placeholder="Search">
        <ul class="sresults" id="sres" role="listbox" hidden></ul>
      </div>
      <div class="lang" role="group" data-t-aria="lang" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="pl" aria-pressed="false">PL</button>
      </div>
    </div>
  </header>

  <div class="drawer" id="drawer" hidden>
    <div class="drawer__scrim" id="drawer-scrim"></div>
    <aside class="drawer__panel" role="dialog" aria-modal="true" data-t-aria="menu" aria-label="Menu">
      <div class="drawer__head band">
        <button class="icon-btn" id="drawer-close" type="button" data-t-aria="close" aria-label="Close menu">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <span class="logo"><span>OUTLAST</span></span>
      </div>
      <nav id="drawer-nav" aria-label="Main"></nav>
    </aside>
  </div>

  <main id="app" tabindex="-1"></main>

  <button class="fab" id="chat-fab" type="button" aria-expanded="false" aria-controls="chat"><svg class="flint" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="23" class="flint__bg"/><path class="flint__hat" d="M9 22 Q10 7 24 7 Q38 7 39 22Z"/><rect class="flint__band" x="8" y="19" width="32" height="6" rx="3"/><circle class="flint__skin" cx="24" cy="30" r="11"/><path class="flint__beard" d="M14 31 Q16 42 24 42 Q32 42 34 31 Q30 36 24 36 Q18 36 14 31Z"/><circle class="flint__eye" cx="20" cy="28" r="1.6"/><circle class="flint__eye" cx="28" cy="28" r="1.6"/></svg><span id="chat-fab-label">Ask Flint</span></button>
  <section class="chat" id="chat" role="dialog" aria-labelledby="chat-title" hidden>
    <header class="chat__head"><svg class="flint" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="23" class="flint__bg"/><path class="flint__hat" d="M9 22 Q10 7 24 7 Q38 7 39 22Z"/><rect class="flint__band" x="8" y="19" width="32" height="6" rx="3"/><circle class="flint__skin" cx="24" cy="30" r="11"/><path class="flint__beard" d="M14 31 Q16 42 24 42 Q32 42 34 31 Q30 36 24 36 Q18 36 14 31Z"/><circle class="flint__eye" cx="20" cy="28" r="1.6"/><circle class="flint__eye" cx="28" cy="28" r="1.6"/></svg><div><strong id="chat-title">Flint</strong><small id="chat-status"></small></div>
      <button class="icon-btn" id="chat-close" type="button" aria-label="Close chat"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </header>
    <div class="chat__log" id="chat-log" aria-live="polite"></div>
    <div class="chat__chips" id="chat-chips"></div>
    <form class="chat__form" id="chat-form">
      <label class="sr-only" for="chat-q">Message</label>
      <input id="chat-q" autocomplete="off" maxlength="600">
      <button class="chat__send" id="chat-send" type="submit" aria-label="Send"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <button class="btn btn--line btn--sm" id="chat-stop" type="button" hidden>Stop</button>
    </form>
    <p class="chat__note" id="chat-note"></p>
  </section>

  <noscript><p style="padding:20px">Outlast needs JavaScript to show its guides.</p></noscript>
  <script src="diagrams.js"></script>
  <script src="guides.js"></script>
  <script src="content.js"></script>
  <script src="forum-seed.js"></script>
  <script src="games.js"></script>
  <script src="ui.js"></script>
  <script src="chat.js"></script>
  <script src="app.js"></script>
</body>
</html>
